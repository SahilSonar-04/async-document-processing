services:
  postgres_test:
    image: pgvector/pgvector:pg16
    container_name: docflow_postgres_test
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow_secret
      POSTGRES_DB: docflow_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docflow_backend_test
    command: sh -c "pip install --no-cache-dir -r requirements-dev.txt --break-system-packages && pytest --cov=app --cov-report=term-missing"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://docflow:docflow_secret@postgres_test:5432/docflow_test
      - SYNC_DATABASE_URL=postgresql+psycopg2://docflow:docflow_secret@postgres_test:5432/docflow_test
      - TEST_DATABASE_URL=postgresql+asyncpg://docflow:docflow_secret@postgres_test:5432/docflow_test
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=test_secret_key
      - ENVIRONMENT=test
    depends_on:
      postgres_test:
        condition: service_healthy

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docflow_frontend_test
    command: sh -c "npm install && npm test -- --coverage"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CI=true
      